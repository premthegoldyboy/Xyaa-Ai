name: Code Studio AI coding worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: Approved coding task (max 6000 characters)
        required: true
        type: string
      base_ref:
        description: Branch or commit to work from
        required: true
        type: string
        default: xyaa/molten-speech-ime-container

permissions:
  contents: read

concurrency:
  group: xyaa-code-studio-worker-${{ github.workflow }}-${{ inputs.base_ref }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate inputs
        env:
          BASE_REF: ${{ inputs.base_ref }}
          TASK: ${{ inputs.task }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$BASE_REF" != *".."* && "$BASE_REF" != -* ]]
          [[ -n "$TASK" && "${#TASK}" -le 6000 ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and apply isolated patch
        env:
          CODE_STUDIO_TASK: ${{ inputs.task }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python3 scripts/code_studio_worker.py

      - name: Run repository smoke tests
        run: node --test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build Android debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug

      - name: Summarize result
        if: always()
        env:
          TASK: ${{ inputs.task }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          {
            echo "# XYAA Code Studio coding result"
            echo
            echo "- Base ref: $BASE_REF"
            echo "- Task: $TASK"
            echo "- Patch applied in disposable runner: see code-studio.patch artifact"
            echo "- Repository branch was not modified or pushed."
            echo "- Smoke tests and Android build must both pass before accepting the patch."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xyaa-code-studio-patch-${{ github.run_number }}
          path: |
            code-studio.patch
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
