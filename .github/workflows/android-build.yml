name: Android build
on:
  push:
    branches: [main, "xyaa/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build debug APK
        run: gradle lintDebug testDebugUnitTest assembleDebug
      - name: Print Android lint diagnostics
        if: always()
        run: |
          report=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$report" ]; then cat "$report"; else echo "No lint text report was generated."; fi
      - uses: actions/upload-artifact@v4
        with:
          name: xyaa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
