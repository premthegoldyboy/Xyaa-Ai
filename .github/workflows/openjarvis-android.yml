name: OpenJarvis Android build

on:
  push:
    branches: [openjarvis-android-alternative]
    paths:
      - "android/**"
      - ".github/workflows/openjarvis-android.yml"
  pull_request:
    branches: [openjarvis-android-alternative]
    paths:
      - "android/**"
      - ".github/workflows/openjarvis-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and upstream OpenJarvis submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug

# The workflow intentionally builds only the native Android client in this branch.
