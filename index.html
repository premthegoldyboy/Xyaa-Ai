<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b14"><meta name="description" content="XYAA — personal browser voice assistant">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg">
<title>XYAA</title>
<style>
:root{color-scheme:dark;--bg:#0b0b14;--panel:#171728;--line:#30304a;--accent:#ff4fa3;--fg:#f5f3fa;--muted:#aaa8bd}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:15px 18px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;letter-spacing:3px;margin:0}#status{font-size:12px;color:var(--muted);margin-top:3px}
button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#settings{background:none;font-size:23px;padding:8px}#chat{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px}.bubble{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.user{align-self:flex-end;background:#292944}.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
footer{padding:12px 16px 18px;border-top:1px solid #ffffff12;display:flex;flex-direction:column;align-items:center;gap:12px}#mic{width:72px;height:72px;border-radius:50%;background:var(--accent);font-size:28px}#mic.active{box-shadow:0 0 0 10px #ff4fa322}#composer{display:flex;gap:8px;width:100%;max-width:700px}#message{min-width:0;flex:1;border-radius:22px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:12px 15px}#send{border-radius:22px;background:#292944;padding:0 18px}.toggle{font-size:13px;color:var(--muted)}
dialog{width:min(92vw,440px);max-height:85dvh;overflow:auto;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:18px}dialog::backdrop{background:#000b}dialog label{display:block;font-size:13px;color:var(--muted);margin:13px 0 5px}dialog input,dialog select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--fg)}.note{font-size:12px;color:var(--muted);line-height:1.45}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.actions button{padding:10px 15px;border-radius:9px;background:#292944}.actions .primary{background:var(--accent);color:#1b0b14}
</style>
</head>
<body>
<header><div><h1>XYAA</h1><div id="status" role="status" aria-live="polite">Ready</div></div><button id="settings" aria-label="Settings">⚙️</button></header>
<main id="chat" aria-live="polite"></main>
<footer><button id="mic" aria-label="Start voice input">🎙️</button><label class="toggle"><input id="handsfree" type="checkbox"> Hands-free while this page is open</label><form id="composer"><input id="message" placeholder="Message XYAA…" autocomplete="off" aria-label="Message"><button id="send">Send</button></form></footer>
<dialog id="prefs"><h3>XYAA Settings</h3>
<label>Gemini API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Paste API key">
<p class="note">Stored in this browser's local storage. This is not a secure secret vault; do not share this browser profile or key.</p>
<label>Your name</label><input id="userName" maxlength="40">
<label>Listening language</label><select id="language"><option value="en-IN">English (India)</option><option value="en-US">English (US)</option><option value="te-IN">Telugu</option><option value="hi-IN">Hindi</option></select>
<label>Speech voice</label><select id="voice"><option value="">Automatic</option></select>
<label>Gemini model</label><input id="model" value="gemini-2.5-flash">
<div class="actions"><button id="closePrefs" type="button">Close</button><button id="savePrefs" class="primary" type="button">Save</button></div></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),defaults={key:'',user:'there',lang:'en-IN',voice:'',model:'gemini-2.5-flash'};
let cfg={...defaults};try{cfg={...cfg,...JSON.parse(localStorage.getItem('xyaa-settings')||'{}')}}catch{}
let turns=[],voices=[],recognition=null,listening=false,busy=false,speaking=false,session=0,restart=null;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function status(s){$('status').textContent=s}
function sayBubble(who,text){const n=document.createElement('div');n.className='bubble '+who;n.textContent=String(text);$('chat').append(n);$('chat').scrollTop=$('chat').scrollHeight}
function setMic(on){$('mic').classList.toggle('active',on);$('mic').setAttribute('aria-label',on?'Stop listening':'Start voice input')}
function stopListen(){clearTimeout(restart);if(recognition){try{recognition.onend=null;recognition.stop()}catch{}}recognition=null;listening=false;setMic(false)}
function loadVoices(){voices=speechSynthesis.getVoices();const s=$('voice'),v=cfg.voice;s.replaceChildren(new Option('Automatic',''));voices.forEach(x=>s.add(new Option(x.name+' ('+x.lang+')',x.name)));s.value=voices.some(x=>x.name===v)?v:''}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=loadVoices;loadVoices()}
function speechText(text){
  return String(text)
    .replace(/\bXYAA\b/gi,'Zyaa')
    .replace(/\*\*(.*?)\*\*/g,'$1')
    .replace(/\*(.*?)\*/g,'$1')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'$1')
    .replace(/https?:\/\/\S+/g,'a link')
    .replace(/\s+/g,' ')
    .trim();
}
function speak(text){
  if(!('speechSynthesis'in window))return Promise.resolve();
  const spoken=speechText(text);
  if(!spoken)return Promise.resolve();
  return new Promise(resolve=>{
    let done=false, timeoutId=0;
    const finish=()=>{if(done)return;done=true;clearTimeout(timeoutId);speaking=false;resolve()};
    try{
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(spoken);
      const v=voices.find(x=>x.name===cfg.voice)||voices.find(x=>x.lang.toLowerCase()===cfg.lang.toLowerCase())||voices.find(x=>x.lang.toLowerCase().startsWith(cfg.lang.slice(0,2)));
      if(v){u.voice=v;u.lang=v.lang}else u.lang=cfg.lang;
      u.rate=1.02;u.pitch=1.04;u.volume=1;
      u.onend=finish;u.onerror=finish;speaking=true;
      timeoutId=setTimeout(()=>{try{window.speechSynthesis.cancel()}catch{};finish()},Math.min(60000,Math.max(10000,spoken.length*150)));
      window.speechSynthesis.speak(u);
    }catch{finish()}
  });
}
function listen(){if(!SpeechRecognition){sayBubble('assistant','Voice recognition is not supported in this browser. Try Chrome.');$('handsfree').checked=false;return}if(listening||busy||speaking)return;const id=session,r=new SpeechRecognition();recognition=r;r.lang=cfg.lang;r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{if(id!==session){try{r.stop()}catch{};return}listening=true;setMic(true);status('Listening…')};r.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript?.trim();if(t&&id===session){stopListen();handle(t)}};r.onerror=e=>{listening=false;setMic(false);if(e.error==='not-allowed'||e.error==='service-not-allowed'){$('handsfree').checked=false;sayBubble('assistant','Microphone permission denied. Allow microphone access in browser site settings.')}else if(!['no-speech','aborted'].includes(e.error))status('Voice input unavailable')};r.onend=()=>{if(recognition===r)recognition=null;listening=false;setMic(false);if(id===session&&$('handsfree').checked&&!busy&&!speaking)restart=setTimeout(listen,700);else if(!busy&&!speaking)status('Ready')};try{r.start()}catch{recognition=null;status('Ready')}}
function systemPrompt(){return 'You are XYAA (pronounced “Zyaa”), a natural, warm, conversational voice assistant for '+cfg.user+'. Speak like a helpful person, not a text reader. Keep spoken replies concise and natural, use contractions where appropriate, avoid markdown, bullet lists, decorative symbols, stage directions, and unnecessary repetition. Do not spell out your own name letter by letter; say “Zyaa”. Reply in the language the user uses. Return ONLY JSON: {"reply":"...","action":"none|open_url|search|youtube|call|whatsapp|timer|time","arg":"..."}. Use none unless a clear action is requested. open_url arg must be http/https URL. call/whatsapp arg is phone number. timer arg is integer seconds. Never claim an action happened unless it did.'}
async function ask(text){if(!cfg.key)throw Error('NO_KEY');const pending=[...turns,{role:'user',parts:[{text}]}].slice(-12);const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(cfg.model)+':generateContent';const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':cfg.key},body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt()}]},contents:pending,generationConfig:{responseMimeType:'application/json',temperature:.65}})});let data;try{data=await res.json()}catch{throw Error('BAD_RESPONSE')}if(!res.ok)throw Error(data?.error?.message||'HTTP '+res.status);const raw=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim();if(!raw)throw Error('EMPTY');let obj;try{obj=JSON.parse(raw)}catch{throw Error('BAD_JSON')}if(!obj||typeof obj.reply!=='string')throw Error('BAD_FORMAT');turns=[...pending,{role:'model',parts:[{text:raw}]}].slice(-12);if(!['none','open_url','search','youtube','call','whatsapp','timer','time'].includes(obj.action))obj.action='none';return {reply:obj.reply,action:obj.action,arg:String(obj.arg??'')}}
function openSafe(url){const w=window.open(url,'_blank');if(w)w.opener=null;else sayBubble('assistant','Pop-up blocked. Allow pop-ups for XYAA to open this link.')}
function act(a,arg){const v=String(arg).trim();if(a==='open_url'){try{const u=new URL(v.includes('://')?v:'https://'+v);if(!['https:','http:'].includes(u.protocol))throw 0;openSafe(u.href)}catch{sayBubble('assistant','That web address is invalid.')}return ''}
if(a==='search'){if(v)openSafe('https://www.google.com/search?q='+encodeURIComponent(v));return ''}
if(a==='youtube'){if(v)openSafe('https://www.youtube.com/results?search_query='+encodeURIComponent(v));return ''}
if(a==='call'){const p=v.replace(/[^+\d]/g,'');if(!/^\+?\d{7,15}$/.test(p)){sayBubble('assistant','That phone number looks invalid.');return ''}if(confirm('Open phone app to call '+p+'?'))location.href='tel:'+p;return ''}
if(a==='whatsapp'){const p=v.replace(/\D/g,'');if(!/^\d{7,15}$/.test(p)){sayBubble('assistant','Use a valid number including country code.');return ''}if(confirm('Open WhatsApp chat with '+p+'?'))openSafe('https://wa.me/'+p);return ''}
if(a==='timer'){const n=Number(v);if(!Number.isInteger(n)||n<1||n>86400){sayBubble('assistant','Timer must be between 1 second and 24 hours.');return ''}sayBubble('assistant','Timer set for '+n+' seconds. Keep this page open.');setTimeout(()=>{sayBubble('assistant','Your timer is finished.');speak('Your timer is finished.')},n*1000);return ''}
if(a==='time')return new Date().toLocaleString();return ''}
async function handle(input){const text=input.trim();if(!text||busy)return;sayBubble('user',text);if(!cfg.key){sayBubble('assistant','Add your Gemini API key in Settings to start chatting.');$('prefs').showModal();return}busy=true;stopListen();status('Thinking…');try{const result=await ask(text);const extra=act(result.action,result.arg);const reply=[result.reply,extra].filter(Boolean).join(' ');sayBubble('assistant',reply||'Done.');await speak(reply||'Done.')}catch(e){let m='Could not connect to Gemini. Check internet, API key and model.';if(e.message==='NO_KEY')m='Add your Gemini API key in Settings.';else if(['BAD_RESPONSE','EMPTY','BAD_JSON','BAD_FORMAT'].includes(e.message))m='Gemini returned an unexpected response. Try again.';else if(/401|403|API key|permission/i.test(e.message))m='Gemini rejected this API key or access.';else if(/429|quota|rate/i.test(e.message))m='Gemini quota or rate limit reached. Try later.';sayBubble('assistant',m);status('Connection issue')}finally{busy=false;if($('handsfree').checked)restart=setTimeout(listen,500);else if(!speaking)status('Ready')}}
$('composer').addEventListener('submit',e=>{e.preventDefault();const i=$('message'),v=i.value;i.value='';handle(v)});
$('mic').onclick=()=>{session++;if(listening){stopListen();$('handsfree').checked=false;status('Ready')}else{window.speechSynthesis?.cancel();speaking=false;listen()}};
$('handsfree').onchange=()=>{session++;clearTimeout(restart);if($('handsfree').checked)listen();else stopListen()};
$('settings').onclick=()=>{$('apiKey').value=cfg.key;$('userName').value=cfg.user;$('language').value=cfg.lang;$('model').value=cfg.model;loadVoices();$('voice').value=cfg.voice;$('prefs').showModal()};
$('closePrefs').onclick=()=>$('prefs').close();
$('savePrefs').onclick=()=>{const model=$('model').value.trim();if(!/^[a-zA-Z0-9._-]+$/.test(model)){sayBubble('assistant','Enter a valid model identifier.');return}cfg={key:$('apiKey').value.trim(),user:$('userName').value.trim()||'there',lang:$('language').value,voice:$('voice').value,model};try{localStorage.setItem('xyaa-settings',JSON.stringify(cfg))}catch{sayBubble('assistant','Browser storage is unavailable.')} $('prefs').close();sayBubble('assistant','Settings saved.')};
sayBubble('assistant',cfg.key?'Hello '+cfg.user+'. XYAA is ready.':'Hello! I am XYAA. Open Settings and add your Gemini API key to begin.');
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>status('Offline cache unavailable')));
</script>
</body></html>
